spring:
  application:
    name: term-deposit-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:term_deposit_service}
    username: ${DB_USERNAME:term_deposit_service}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/bank}

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

server:
  port: ${SERVER_PORT:8083}

term-deposit:
  maturity-job:
    cron: ${MATURITY_JOB_CRON:0 0 1 * * *}

clients:
  cbs:
    base-url: ${CBS_BASE_URL:http://localhost:9001}
  notification:
    base-url: ${NOTIFICATION_BASE_URL:http://localhost:9002}

checksum:
  header-name: X-Checksum
  caller-header-name: X-Caller-Service
  timestamp-header-name: X-Checksum-Timestamp
  tolerance-seconds: 300
  secrets:
    nestjs-auth-service: ${CHECKSUM_SECRET_NESTJS_AUTH:}
    notification-service: ${CHECKSUM_SECRET_NOTIFICATION:}

bank:
  tenants:
    default-bank:
      cif-regex: "^[0-9]{10,20}$"
      default-currency: INR
      default-interest-rate-bps: 650

outbox:
  relay:
    fixed-delay-ms: 5000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
  timelimiter:
    configs:
      default:
        timeout-duration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bank.termdeposit: INFO
